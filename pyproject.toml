[project]
name = "dass-cad"
version = "0.1.4"
description = "Parametric CAD model and cut list for the outdoor toilet"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.5,<3",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "watchfiles>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dass = "dass.model:main"
generate-cutlists = "dass.cutlists:main"
generate-build-guide = "dass.build_guide:main"
render-photo = "dass.photo_render:main"
serve-guide = "dass.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dass"]

[tool.uv]
package = true

# Pinned exactly. ty is pre-1.0 and ruff changes its formatter between minor
# releases, so an unpinned upgrade would break the hooks and CI on an
# unrelated commit. Bump these deliberately, in their own change.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "ty==0.0.65",
]

# `.agents/` is vendored skill code. `build/` and `.cache/` are generated.
# None of them are ours to lint, type-check, or test.
[tool.ruff]
extend-exclude = [".agents", "build", ".cache"]

[tool.ty.src]
exclude = [".agents", "build", ".cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src/dass", "scripts"]
branch = true

# The whole measured set is covered, so the gate is binary rather than a
# ratchet: nothing here is omitted, and there is no `# pragma: no cover` in
# the tree. Both are deliberate. An omission is the easy way to hold this
# number up while coverage quietly rots, so anything added to `omit` needs a
# stated reason that survives being argued with -- needing a live browser,
# needing the network, needing a real bound port or subprocess, or being a
# third-party shim. "It is a CLI entry point" is not one: every `main()` here
# is reached through argv injection, and every `if __name__ == "__main__":`
# guard through `runpy` or a `SourceFileLoader`.
[tool.coverage.report]
fail_under = 100
show_missing = true
