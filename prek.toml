# managed by the setup-git-hooks skill — re-run it to change hooks
# regenerate: bash ~/.agents/skills/setup-git-hooks/setup-git-hooks.sh --apply --accept

# HAND EDIT — the skill does not carry this line through a regenerate, and it
# drops out silently. Put it back after any re-run.
# .agents/ is vendored skill code, build/ and .cache/ are generated, and all
# three are tracked. Hooks that rewrite files must not touch any of them.
exclude = "^(\\.agents|build|\\.cache)/"

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
stages = ["pre-commit"]

[[repos.hooks]]
id = "end-of-file-fixer"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-merge-conflict"
stages = ["pre-commit"]

[[repos.hooks]]
id = "detect-private-key"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-added-large-files"
stages = ["pre-commit"]

[[repos.hooks]]
id = "mixed-line-ending"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-yaml"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-json"
exclude = "(^|/)(tsconfig|jsconfig|devcontainer)\\.json$|(^|/)\\.vscode/"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-toml"
stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff-format"
language = "system"
entry = "uv run ruff format --check"
files = "\\.py$"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "ruff"
name = "ruff"
language = "system"
entry = "uv run ruff check"
files = "\\.py$"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "pytest"
name = "pytest"
language = "system"
entry = "uv run pytest"
files = "\\.py$"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
entry = "shellcheck"
files = "\\.(sh|bash)$"
pass_filenames = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "ty"
name = "ty"
language = "system"
entry = "uv run ty check src tests scripts"
files = "\\.py$"
pass_filenames = false
stages = ["pre-commit"]
